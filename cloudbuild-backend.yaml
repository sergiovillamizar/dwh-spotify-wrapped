# cloudbuild-backend.yaml
# CI/CD pipeline for FastAPI backend — triggered on push to main with changes in backend/**
# Builds multi-stage Docker image, pushes to Artifact Registry, deploys to Cloud Run,
# and runs Alembic migrations as a post-deploy step.
# Updated 2026-05-14: infra fully provisioned (VPC Connector, Secrets, Cloud Run, LB)

timeout: '1200s'

substitutions:
  _REGION: us-central1
  _AR_REPO: spotify-wrapped
  _SERVICE: spotify-backend
  _IMAGE_NAME: backend
  _VPC_CONNECTOR: spotify-vpc-connector
  _LB_DOMAIN: 34-54-8-28.nip.io
  _SPOTIFY_CLIENT_ID: f8258104cb4c451a88b4cd90cfe724f2

steps:
  # ── Step 1: Verify Artifact Registry repo is accessible ──────────────────
  # Repo 'spotify-wrapped' is managed as infrastructure (created via gcloud/Terraform).
  # This step validates connectivity and fails fast if the repo is missing.
  - id: ensure-artifact-registry
    name: gcr.io/cloud-builders/gcloud
    args:
      - artifacts
      - repositories
      - describe
      - ${_AR_REPO}
      - --project=$PROJECT_ID
      - --location=${_REGION}
    waitFor: ['-']

  # ── Step 2: Configure Docker auth for Artifact Registry ──────────────────
  - id: configure-docker-auth
    name: gcr.io/cloud-builders/gcloud
    args:
      - auth
      - configure-docker
      - ${_REGION}-docker.pkg.dev
    waitFor:
      - ensure-artifact-registry

  # ── Step 3: Build multi-stage Docker image ────────────────────────────────
  - id: docker-build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - production
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:latest
      - -f
      - backend/Dockerfile
      - backend/
    waitFor:
      - configure-docker-auth

  # ── Step 4: Push image to Artifact Registry ───────────────────────────────
  - id: docker-push-backend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}
    waitFor:
      - docker-build-backend

  # ── Step 5: Deploy to Cloud Run ───────────────────────────────────────────
  - id: cloudrun-deploy-backend
    name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --vpc-connector=${_VPC_CONNECTOR}
      - --vpc-egress=private-ranges-only
      - --set-cloudsql-instances=$PROJECT_ID:${_REGION}:spotify-postgres
      - --set-secrets=SPOTIFY_CLIENT_SECRET=spotify-client-secret:latest,DB_PASSWORD=db-password:latest,SECRET_KEY=jwt-secret:latest
      - --set-env-vars=SPOTIFY_CLIENT_ID=${_SPOTIFY_CLIENT_ID},CLOUD_SQL_INSTANCE=$PROJECT_ID:${_REGION}:spotify-postgres,SPOTIFY_REDIRECT_URI=https://${_LB_DOMAIN}/v1/auth/callback,FRONTEND_URL=https://${_LB_DOMAIN}
      # $PROJECT_ID expands correctly in step args (not in substitutions block)
      - --service-account=sa-cloudrun-backend@$PROJECT_ID.iam.gserviceaccount.com
      # Ingress: only LB + internal traffic (matches Terraform config)
      - --ingress=internal-and-cloud-load-balancing
      # allUsers has roles/run.invoker (granted via Terraform IAM); LB requires this
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=3
      - --port=8000
      - --project=$PROJECT_ID
    waitFor:
      - docker-push-backend

  # ── Step 6: Run Alembic migrations via Cloud Run Job ─────────────────────
  # Cloud Build workers are outside the VPC and cannot reach Cloud SQL private IP.
  # Solution: deploy a Cloud Run Job (has VPC Connector + Cloud SQL proxy sidecar)
  # that runs migrate.sh, then execute it and wait for completion.
  # 'gcloud run jobs deploy' is idempotent — creates on first run, updates on subsequent.
  - id: alembic-upgrade-head
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA"

        gcloud run jobs deploy backend-migrate \
          --image="$$IMAGE" \
          --region=${_REGION} \
          --set-cloudsql-instances="$PROJECT_ID:${_REGION}:spotify-postgres" \
          --vpc-connector=${_VPC_CONNECTOR} \
          --vpc-egress=private-ranges-only \
          --set-secrets=DB_PASSWORD=db-password:latest \
          --set-env-vars="CLOUD_SQL_INSTANCE=$PROJECT_ID:${_REGION}:spotify-postgres" \
          --service-account=sa-cloudrun-backend@$PROJECT_ID.iam.gserviceaccount.com \
          --command=bash \
          --args=migrate.sh \
          --project=$PROJECT_ID

        gcloud run jobs execute backend-migrate \
          --region=${_REGION} \
          --wait \
          --project=$PROJECT_ID
    waitFor:
      - docker-push-backend

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
