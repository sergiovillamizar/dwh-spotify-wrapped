# cloudbuild-backend.yaml
# CI/CD pipeline for FastAPI backend — triggered on push to main with changes in backend/**
# Builds multi-stage Docker image, pushes to Artifact Registry, deploys to Cloud Run,
# and runs Alembic migrations as a post-deploy step.
# Updated 2026-05-14: infra fully provisioned (VPC Connector, Secrets, Cloud Run, LB)

timeout: '1200s'

availableSecrets:
  secretManager:
    # Only DB_PASSWORD is needed inside Cloud Build (alembic step).
    # SPOTIFY_CLIENT_SECRET and JWT_SECRET are passed directly to Cloud Run
    # via --set-secrets in the deploy step — they do NOT need secretEnv here.
    - versionName: projects/$PROJECT_ID/secrets/db-password/versions/latest
      env: DB_PASSWORD

substitutions:
  _REGION: us-central1
  _AR_REPO: spotify-wrapped
  _SERVICE: backend
  _VPC_CONNECTOR: spotify-vpc-connector

steps:
  # ── Step 1: Verify Artifact Registry repo is accessible ──────────────────
  # Repo 'spotify-wrapped' is managed as infrastructure (created via gcloud/Terraform).
  # This step validates connectivity and fails fast if the repo is missing.
  - id: ensure-artifact-registry
    name: gcr.io/cloud-builders/gcloud
    args:
      - artifacts
      - repositories
      - describe
      - ${_AR_REPO}
      - --project=$PROJECT_ID
      - --location=${_REGION}
    waitFor: ['-']

  # ── Step 2: Configure Docker auth for Artifact Registry ──────────────────
  - id: configure-docker-auth
    name: gcr.io/cloud-builders/gcloud
    args:
      - auth
      - configure-docker
      - ${_REGION}-docker.pkg.dev
    waitFor:
      - ensure-artifact-registry

  # ── Step 3: Build multi-stage Docker image ────────────────────────────────
  - id: docker-build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - production
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest
      - -f
      - backend/Dockerfile
      - backend/
    waitFor:
      - configure-docker-auth

  # ── Step 4: Push image to Artifact Registry ───────────────────────────────
  - id: docker-push-backend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}
    waitFor:
      - docker-build-backend

  # ── Step 5: Deploy to Cloud Run ───────────────────────────────────────────
  - id: cloudrun-deploy-backend
    name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --vpc-connector=${_VPC_CONNECTOR}
      - --vpc-egress=private-ranges-only
      - --set-secrets=SPOTIFY_CLIENT_SECRET=spotify-client-secret:latest,DB_PASSWORD=db-password:latest,JWT_SECRET=jwt-secret:latest
      # $PROJECT_ID expands correctly in step args (not in substitutions block)
      - --service-account=sa-cloudrun-backend@$PROJECT_ID.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=3
      - --port=8000
      - --project=$PROJECT_ID
    waitFor:
      - docker-push-backend

  # ── Step 6: Run Alembic migrations (post-deploy) ──────────────────────────
  # Uses Cloud SQL Unix socket via the built-in Cloud Build Cloud SQL proxy.
  # If DB is unreachable (e.g. first deploy before DB is ready), the step
  # exits 0 to avoid blocking CI. The Cloud Run service handles retry on
  # startup once the DB is available.
  - id: alembic-upgrade-head
    name: ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
    entrypoint: bash
    args:
      - -c
      - |
        export DATABASE_URL="postgresql+psycopg2://postgres:$$DB_PASSWORD@/dwh?host=/cloudsql/$PROJECT_ID:us-central1:spotify-postgres"
        alembic upgrade head || echo "WARNING: Alembic migration skipped — DB not reachable from Cloud Build. Migrations will run on next deploy with DB connectivity."
    secretEnv:
      - DB_PASSWORD
    waitFor:
      - cloudrun-deploy-backend

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
