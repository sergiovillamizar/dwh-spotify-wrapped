# cloudbuild-frontend.yaml
# CI/CD pipeline for Next.js 14 App Router frontend — triggered on push to main
# with changes in frontend/**. Builds Docker image, syncs static assets to GCS
# with immutable cache headers, deploys to Cloud Run, and invalidates CDN cache.

timeout: '1200s'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/spotify-client-secret/versions/latest
      env: SPOTIFY_CLIENT_SECRET
    - versionName: projects/$PROJECT_ID/secrets/jwt-secret/versions/latest
      env: JWT_SECRET

substitutions:
  _REGION: us-central1
  _AR_REPO: spotify-wrapped
  _SERVICE: spotify-frontend
  _VPC_CONNECTOR: spotify-vpc-connector
  _STATIC_BUCKET: spotify-wrapped-static
  _URL_MAP: lb-url-map
  _API_URL: https://34-54-8-28.nip.io

steps:
  # ── Step 1: Ensure Artifact Registry repo exists ─────────────────────────
  - id: ensure-artifact-registry
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        gcloud artifacts repositories describe ${_AR_REPO} \
          --project=$PROJECT_ID \
          --location=${_REGION} \
          --format="value(name)" 2>/dev/null \
        || gcloud artifacts repositories create ${_AR_REPO} \
          --project=$PROJECT_ID \
          --location=${_REGION} \
          --repository-format=docker \
          --description="Docker images for Spotify Wrapped services"
    waitFor: ['-']

  # ── Step 2: Configure Docker auth for Artifact Registry ──────────────────
  - id: configure-docker-auth
    name: gcr.io/cloud-builders/gcloud
    args:
      - auth
      - configure-docker
      - ${_REGION}-docker.pkg.dev
    waitFor:
      - ensure-artifact-registry

  # ── Step 3: Install Node dependencies ────────────────────────────────────
  - id: npm-install
    name: node:20-alpine
    entrypoint: npm
    args:
      - ci
    dir: frontend
    waitFor: ['-']

  # ── Step 4: Build Next.js application ────────────────────────────────────
  - id: npm-build
    name: node:20-alpine
    entrypoint: npm
    args:
      - run
      - build
    dir: frontend
    env:
      - NEXT_PUBLIC_API_URL=${_API_URL}
    secretEnv:
      - SPOTIFY_CLIENT_SECRET
      - JWT_SECRET
    waitFor:
      - npm-install

  # ── Step 5: Build Docker image ────────────────────────────────────────────
  - id: docker-build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest
      - -f
      - frontend/Dockerfile
      - frontend/
    waitFor:
      - configure-docker-auth
      - npm-build

  # ── Step 6: Push image to Artifact Registry ───────────────────────────────
  - id: docker-push-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}
    waitFor:
      - docker-build-frontend

  # ── Step 7: Sync static assets to GCS ────────────────────────────────────
  - id: gsutil-sync-static
    name: gcr.io/cloud-builders/gsutil
    args:
      - -m
      - rsync
      - -r
      - -d
      - frontend/.next/static/
      - gs://${_STATIC_BUCKET}/_next/static/
    waitFor:
      - npm-build

  # ── Step 8: Set immutable cache headers on static assets ─────────────────
  - id: gsutil-set-cache-headers
    name: gcr.io/cloud-builders/gsutil
    entrypoint: bash
    args:
      - -c
      - |
        gsutil -m setmeta \
          -h "Cache-Control:public,max-age=31536000,immutable" \
          "gs://${_STATIC_BUCKET}/_next/static/**"
    waitFor:
      - gsutil-sync-static

  # ── Step 9: Deploy to Cloud Run ───────────────────────────────────────────
  - id: cloudrun-deploy-frontend
    name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --vpc-connector=${_VPC_CONNECTOR}
      - --vpc-egress=private-ranges-only
      - --set-secrets=SPOTIFY_CLIENT_SECRET=spotify-client-secret:latest,JWT_SECRET=jwt-secret:latest
      - --service-account=sa-cloudrun-frontend@$PROJECT_ID.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=3
      - --port=3000
      - --project=$PROJECT_ID
    waitFor:
      - docker-push-frontend

  # ── Step 10: Invalidate CDN cache ────────────────────────────────────────
  - id: invalidate-cdn-cache
    name: gcr.io/cloud-builders/gcloud
    args:
      - compute
      - url-maps
      - invalidate-cdn-cache
      - ${_URL_MAP}
      - --path=/*
      - --project=$PROJECT_ID
    waitFor:
      - cloudrun-deploy-frontend
      - gsutil-set-cache-headers

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
